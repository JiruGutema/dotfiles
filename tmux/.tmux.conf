# -- Basic Settings ------------------------------------------
set -g prefix C-b
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g default-command "${SHELL}"

# -- Key Bindings ------------------------------------------

# Pane management
bind r split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Move between panes using Alt + hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 50
set -g status-left "#{session_name} "
set -g status-right "#{host} %Y-%m-%d %H:%M"
set -g status-right-length 50

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'catppuccin/tmux'

# Theme configuration
set -g @catppuccin_flavour 'mocha'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# 1. Fix escape lag completely (overrides tmux-sensible)
set -sg escape-time 10

# 2. Fix true color support (modern RGB directive)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# 3. Global clipboard settings
set -g set-clipboard on          # Use OSC 52 sequence to sync systems
setw -g mode-keys vi            # Use Vi keys in copy mode
# Override the default copy command to use Wayland's clipboard tool
set -s copy-command 'wl-copy'
# If you use keyboard copy mode, make 'y' work like Vim
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
