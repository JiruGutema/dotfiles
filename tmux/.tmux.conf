# =============================================================================
# Basic Settings
# =============================================================================
set -g prefix C-b
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g default-command "${SHELL}"

# Reduce escape lag
set -sg escape-time 10

# True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Clipboard (Wayland)
set -g set-clipboard on
setw -g mode-keys vi
set -s copy-command 'wl-copy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Window naming (directory based)
set -g automatic-rename on
setw -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g allow-rename off

# =============================================================================
# Key Bindings
# =============================================================================
bind r split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# =============================================================================
# Status Bar
# =============================================================================
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-left "#{session_name} "

# Do NOT set status-right here — continuum + catppuccin need to control it

# =============================================================================
# Plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme night   # night (default) | storm | moon | day
set -g @tokyo-night-tmux_transparent 1 # transparent background
set -g @tokyo-night-tmux_show_netspeed 1 # show net speed
# Core plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Session persistence (continuum must be last)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum / Resurrect
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# =============================================================================
# Initialize TPM (must be at the very bottom)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
