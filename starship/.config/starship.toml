# ~/.config/starship.toml

# Insert a blank line between shell prompts for breathing room
add_newline = false

# Define the structural layout of the prompt
format = """
$directory$git_branch$git_status
$character"""

# ==========================================
# Core Prompt Elements
# ==========================================

[directory]
style = "bold cyan"
read_only = " 󰌾"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ""
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
# The arrow turns red if the last command failed
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# ==========================================
# Git Integration
# ==========================================

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
# Shows modifications, staging, and unpushed commits cleanly
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count} "
stashed = "󰏗 "
modified = "!${count} "
staged = "+${count} "
renamed = "» "
deleted = "✘ "

