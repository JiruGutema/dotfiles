# Alacritty configuration — tuned for v0.13.2
# Schema note: in 0.13.x, `import`, `live_config_reload`, and `shell` live at
# the ROOT level (the `[general]` table was only added in 0.14). Keep them here.

# Theme is layered in via import; the importing file is applied last, so any
# keys set below override the theme.
import = ["~/.config/alacritty/themes/themes/tokyo_night.toml"]

# Reload the running terminal whenever this file is saved.
live_config_reload = true


[env]
# Advertise truecolor + correct terminfo so apps (vim, tmux, etc.) behave.
TERM = "alacritty"
XCURSOR_THEME = "Adwaita"
XCURSOR_SIZE = "24"
[window]
padding = { x = 2, y = 2 }
# Even out leftover padding so glyphs never sit flush against the edge.
dynamic_padding = true
# Server-side decorations on Linux; switch to "None" for a borderless look.
decorations = "Full"
opacity = 0.99
startup_mode = "Windowed"
dynamic_title = true
# WM_CLASS — lets your window manager target Alacritty with rules.
class = { instance = "Alacritty", general = "Alacritty" }

[scrolling]
history = 50000
multiplier = 3

[font]
size = 11.0
# Use a custom built-in font for box-drawing/block glyphs so TUIs render
# seamlessly regardless of the chosen font.
builtin_box_drawing = true

[font.normal]
# JetBrainsMono Nerd Font is installed (Regular face). Bold/italic are
# synthesized from this face by fontconfig, so they are intentionally not
# pinned to non-existent dedicated styles.
family = "JetBrainsMono Nerd Font"
style = "Regular"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
blink_timeout = 0
unfocused_hollow = true
thickness = 0.18

[selection]
# Copy selected text straight to the system clipboard.
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

[terminal]
# Allow apps to read/write the clipboard via OSC 52, but only on copy
# (paste-from-OSC52 is a common exfiltration vector, so keep it copy-only).
osc52 = "OnlyCopy"

[bell]
animation = "EaseOutExpo"
duration = 120
color = "#7aa2f7"

[keyboard]
bindings = [
    # New window in the current working directory.
    { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
    # Clipboard.
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    # Font size (character keys, per the 0.13.x keyboard API).
    { key = "=", mods = "Control", action = "IncreaseFontSize" },
    { key = "+", mods = "Control", action = "IncreaseFontSize" },
    { key = "-", mods = "Control", action = "DecreaseFontSize" },
    { key = "0", mods = "Control", action = "ResetFontSize" },
    # Search scrollback.
    { key = "F", mods = "Control|Shift", action = "SearchForward" },
    { key = "B", mods = "Control|Shift", action = "SearchBackward" },
    # Vi mode for keyboard-driven selection/navigation.
    { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
    # Clear scrollback + screen.
    { key = "K", mods = "Control|Shift", action = "ClearHistory" },
]
